# Фон UI (+ кнопка «докачать описания»): docker compose up -d --build
# Разовая докачка индекса без UI: docker compose --profile scrape run --rm scrape
# Логи: docker compose logs -f
# Стоп: docker compose down
#
# app берёт target scrape: UI и Playwright в одном контейнере.
# network_mode: host — Ollama на 127.0.0.1. По умолчанию UI только localhost.
# Из LAN: SKELBIU_HOST=0.0.0.0 docker compose up -d
services:
  app:
    build:
      context: .
      target: scrape
    image: skelbiu-pc:full
    command: ["python", "-m", "skelbiu_pc", "serve"]
    network_mode: host
    environment:
      SKELBIU_HOST: "127.0.0.1"
      SKELBIU_PORT: "8765"
      SKELBIU_SOURCE: skelbiu
      SKELBIU_ADVISOR: ollama
      OLLAMA_HOST: http://127.0.0.1:11434
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  scrape:
    build:
      context: .
      target: scrape
    image: skelbiu-pc:full
    network_mode: host
    profiles: ["scrape"]
    environment:
      SKELBIU_SOURCE: skelbiu
    volumes:
      - ./data:/app/data
    init: true
